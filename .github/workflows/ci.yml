name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # 失敗しても後続を実行し、1 回の実行で問題を洗い出す。
      - name: 型検査
        if: '!cancelled()'
        run: pnpm typecheck

      - name: Lint とフォーマット検査
        if: '!cancelled()'
        run: pnpm lint

      - name: テストとカバレッジ
        if: '!cancelled()'
        run: pnpm coverage

      # 性能要件（N-1 / N-2）の回帰を検出する（開発方針のリスク表）。
      # しきい値を超えると終了コード 1 になるので、ログの数字を読まずに落ちる。
      - name: ベンチマーク
        if: '!cancelled()'
        run: pnpm sec bench

      # デモ（M3.5）が壊れていないこと。型検査とテストは通っても、Vite の解決や
      # プラグインの設定が壊れれば配れない（ADR-0026）。
      - name: Web のビルド
        if: '!cancelled()'
        run: pnpm build

      - name: カバレッジレポートを保存
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
